name: Android build

on:
  # Run for every branch and tag push.
  push:

  # Run for pull requests targeting any branch.
  pull_request:

  # Keep manual execution available from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Python tests, Android unit tests, Lint, Debug & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify build environment
        run: |
          java -version
          python --version
          python3.11 --version

      - name: Run Python extractor unit tests
        run: python3 -m unittest discover -s app/src/test/python -v

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests, lint, and assemble sideloadable APKs
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload unit test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emre-gallery-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: emre-gallery-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK (sideloadable)
        uses: actions/upload-artifact@v4
        with:
          name: emre-gallery-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Publish GitHub Release APK
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: emre-gallery-release-${{ github.sha }}
          path: release-apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" release-apk/*.apk             --title "Emre Gallery $TAG"             --generate-notes
