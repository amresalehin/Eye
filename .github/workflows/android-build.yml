name: Android build

on:
  push:
    branches:
      - main
      - Develop
      - 'integration/**'
      - 'fix/**'
      - 'chore/**'
      - restore-point-before-removing-cap-of-deep-scan-2026-11-12
  pull_request:
    branches:
      - main
      - Develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify build environment
        run: |
          java -version
          python --version
          python3.11 --version

      - name: Reject unresolved merge-conflict markers
        run: |
          if git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- '*.kt' '*.java' '*.py' '*.kts' '*.gradle' '*.xml' '*.yml' '*.yaml' '*.sh' '*.properties' '*.toml' '*.json'; then
            echo "::error::Unresolved merge-conflict markers found in source files."
            exit 1
          fi

      - name: Validate Python syntax
        run: python3 -m compileall -q app/src/main/python app/src/test/python

      - name: Run Python extractor unit tests
        run: PYTHONPATH=app/src/main/python python3 -m unittest discover -s app/src/test/python -v

      - name: Install Android NDK and CMake when missing
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Android SDK: $SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android sdkmanager was not found at $SDKMANAGER"
            exit 1
          fi

          install_sdk_package() {
            local package="$1"
            local package_dir="$2"
            local attempt=1

            while (( attempt <= 3 )); do
              echo "Installing $package (attempt $attempt/3)..."
              if "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "$package" &&
                 [[ -f "$package_dir/source.properties" ]]; then
                echo "Installed $package successfully."
                return 0
              fi

              echo "Installation of $package was incomplete; removing partial files before retry."
              rm -rf "$package_dir"
              # sdkmanager can leave a truncated archive or extraction workspace after
              # a transient network/runner I/O error. Remove its temporary workspace so
              # the next attempt fetches and extracts a clean package.
              rm -rf "$SDK_ROOT/.temp"
              if (( attempt < 3 )); then
                sleep $((attempt * 5))
              fi
              ((attempt += 1))
            done

            echo "::error::Could not install $package after three attempts."
            return 1
          }

          if [[ ! -f "$SDK_ROOT/cmake/3.22.1/source.properties" ]]; then
            install_sdk_package "cmake;3.22.1" "$SDK_ROOT/cmake/3.22.1"
          else
            echo "Required CMake version is already installed."
          fi

          if [[ ! -f "$SDK_ROOT/ndk/27.0.12077973/source.properties" ]]; then
            install_sdk_package "ndk;27.0.12077973" "$SDK_ROOT/ndk/27.0.12077973"
          else
            echo "Required NDK version is already installed."
          fi

      # Preserve native CMake state across commits on the long-lived feature branch.
      - name: Restore native CMake build cache
        uses: actions/cache@v4
        with:
          path: |
            app/.cxx/
            app/build/intermediates/cxx/
          key: native-cxx-${{ runner.os }}-ndk27-cmake322-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle.kts') }}
          restore-keys: |
            native-cxx-${{ runner.os }}-ndk27-cmake322-

      - name: Restore Python package download cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: python-pip-${{ runner.os }}-3.11-${{ hashFiles('app/build.gradle.kts') }}
          restore-keys: |
            python-pip-${{ runner.os }}-3.11-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/fix/cloud-vision-production-20261110' }}

      - name: Run unit tests, lint, debug and release verification
        run: bash ./gradlew --stacktrace --max-workers=2 --build-cache testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload unit test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-lint-reports-${{ github.sha }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: emre-gallery-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
